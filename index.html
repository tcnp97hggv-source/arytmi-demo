<script>
// Lille DOM-hook: sæt ordet i den runde startknap til "Start her".
// Vi ved ikke præcis hvornår forsiden renderes (innerHTML), så vi lytter på ændringer.
(function(){
  function setStartLabel(){
    try{
      var el = document.querySelector('.rund-knap .rk-ord');
      if(el && el.textContent.trim() !== 'Start her'){
        el.textContent = 'Start her';
      }
    }catch(e){/* no-op */}
  }
  if(document.readyState !== 'loading') setStartLabel();
  else document.addEventListener('DOMContentLoaded', setStartLabel);
  var target = document.body || document.documentElement;
  if(target){
    var mo = new MutationObserver(function(){ setStartLabel(); });
    mo.observe(target, { childList: true, subtree: true });
  }
})();
</script>
